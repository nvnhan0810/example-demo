# Dedicated queue worker (replaces in-container Supervisor [program:queue]).
# Image has no ENTRYPOINT — `args` replaces Dockerfile CMD (web: config:cache + supervisord).
# Own app.kubernetes.io/name so logs (Loki/Grafana/kubectl) stay separate from web.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-ecomerce-queue
  namespace: laravel-ecomerce
  labels:
    app.kubernetes.io/name: laravel-ecomerce-queue
    app.kubernetes.io/component: queue
    app.kubernetes.io/part-of: laravel-ecomerce
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: laravel-ecomerce-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: laravel-ecomerce-queue
        app.kubernetes.io/component: queue
        app.kubernetes.io/part-of: laravel-ecomerce
    spec:
      # Longer than --timeout so the current job can finish before SIGKILL.
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: queue-worker
          image: ghcr.io/nvnhan0810/example-demo/laravel-ecomerce:latest
          imagePullPolicy: Always
          # Docker: no ENTRYPOINT. Dockerfile CMD = config:cache + supervisord (web only).
          # This list replaces that whole CMD → php artisan queue:work only.
          args:
            - php
            - artisan
            - queue:work
            - redis
            - --sleep=1
            - --tries=3
            - --max-time=3600
            - --timeout=90
          envFrom:
            - secretRef:
                name: app-env
          # No HTTP/liveness probe: if queue:work exits, kubelet restarts the container.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
