apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-ecomerce
  namespace: laravel-ecomerce
  labels:
    app.kubernetes.io/name: laravel-ecomerce
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: laravel-ecomerce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: laravel-ecomerce
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: app
          image: ghcr.io/nvnhan0810/example-demo/laravel-ecomerce:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: app-env
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
