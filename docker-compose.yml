services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sql:/docker-entrypoint-initdb.d/00-init-multi-db.sql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
    ports:
      - "9092:9092"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8088:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka

  ui:
    build:
      context: ./services/ui
      dockerfile: Dockerfile
    environment:
      - VITE_API_PROXY_TARGET=http://gateway:3000
    ports:
      - "5173:5173"
    depends_on:
      - gateway

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - KAFKA_BROKERS=kafka:29092
      - CATALOG_URL=http://catalog:3001
      - SEARCH_URL=http://search:3002
      - ORDERS_URL=http://orders:3003
      - INVENTORY_URL=http://inventory:3004
      - PAYMENTS_URL=http://payments:3005
      - SHIPPING_URL=http://shipping:3006
    ports:
      - "3000:3000"
    depends_on:
      - kafka
      - postgres
      - redis
      - elasticsearch

  catalog:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/catalog_db
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - kafka
      - postgres

  search:
    build:
      context: ./services/search
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3002
      - ELASTIC_URL=http://elasticsearch:9200
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - kafka
      - elasticsearch

  orders:
    build:
      context: ./services/orders
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/orders_db
      - KAFKA_BROKERS=kafka:29092
      - REDIS_URL=redis://redis:6379
    depends_on:
      - kafka
      - postgres
      - redis

  inventory:
    build:
      context: ./services/inventory
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/inventory_db
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - kafka
      - postgres

  payments:
    build:
      context: ./services/payments
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/payments_db
      - KAFKA_BROKERS=kafka:29092
      - REDIS_URL=redis://redis:6379
    depends_on:
      - kafka
      - postgres
      - redis

  shipping:
    build:
      context: ./services/shipping
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/shipping_db
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - kafka
      - postgres

volumes:
  pg_data:

